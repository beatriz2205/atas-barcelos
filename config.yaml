# Configuração central. Os modelos e os pipelines RAG são eixos de experiência
# independentes: fixa-se um pipeline para comparar modelos, ou fixa-se um modelo
# para comparar pipelines.

paths:
  atas_dir: data/atas            # PDFs das atas
  pipelines_dir: data/pipelines  # OCR, chunks e índice isolados por pipeline
  questions: data/questions.jsonl
  outputs_dir: outputs

# A chave nunca é incluída neste ficheiro nem enviada para Git. Cada elemento do
# grupo coloca a sua própria chave em OLLAMA_TOKEN (ver .env.example).
ollama:
  host: http://afonsinho.di.uminho.pt:4590
  token_env: OLLAMA_TOKEN
  max_retries: 3
  retry_delay_s: 5

# Cada entrada em `pipelines` é uma configuração RAG COMPLETA. As âncoras YAML
# só evitam repetição no ficheiro: após leitura, cada pipeline tem as secções
# OCR, chunking, embeddings, retrieval, generation e prompt.
pipeline_defaults: &pipeline_defaults
  ocr:
    language: por
    force_ocr: false             # false: OCR só nas páginas sem texto; true: refaz o OCR de todas as páginas
    rotate_pages: true
    deskew: false
    clean: false
    remove_background: false
  chunking:
    max_chars: 1500              # ~350-400 tokens
    overlap_chars: 200
  embeddings:
    # Calculados no servidor Ollama (rápido). O EmbeddingGemma usa prefixos diferentes
    # para perguntas e documentos. Alternativa local, no CPU (lenta):
    #   provider: sentence_transformers, model: BAAI/bge-m3, sem prefixos.
    provider: ollama
    model: embeddinggemma:latest
    query_prefix: "task: search result | query: "
    document_prefix: "title: none | text: "
  retrieval:
    top_k: 5
  generation:
    temperature: 0.0
    # 1024 e não 512: o Qwen 3 gera raciocínio (<think>) que esgotava o teto de 512
    # antes da resposta final (4 respostas vazias em 28 perguntas no primeiro ensaio).
    max_tokens: 1024
  prompt:
    strict_grounding: true
    abstention_text: A informação não consta das atas fornecidas.
    language: português europeu
    require_citations: true

default_pipeline: baseline
pipelines:
  # Referência: o pipeline RAG original, agora sempre com OCR antes da extração.
  baseline:
    <<: *pipeline_defaults
    description: OCR com rotação, chunks por proposta, embeddinggemma, top-5 e prompt com fontes.

  # Cada variante altera apenas uma decisão, para conclusões interpretáveis.
  ocr_deskew:
    <<: *pipeline_defaults
    description: Baseline com correção de inclinação das páginas digitalizadas.
    ocr:
      language: por
      force_ocr: false
      rotate_pages: true
      deskew: true
      clean: false
      remove_background: false
  chunks_2500:
    <<: *pipeline_defaults
    description: Baseline com chunks maiores, para testar mais contexto por deliberação.
    chunking:
      max_chars: 2500
      overlap_chars: 300
  top_k_10:
    <<: *pipeline_defaults
    description: Baseline com os dez excertos semanticamente mais próximos.
    retrieval:
      top_k: 10
  hybrid_baseline:
    <<: *pipeline_defaults
    description: Baseline com pesquisa híbrida (semântica + BM25 em português), fundida por RRF.
    retrieval:
      top_k: 5
      hybrid:
        fusion: rrf              # funde pela posição: os scores do cosseno e do BM25 não são comparáveis
        rrf_k: 60
        bm25_language: portuguese  # stemming e palavras comuns ("aprovada"/"aprovação" -> "aprov")
  hybrid_weighted:
    <<: *pipeline_defaults
    description: Pesquisa híbrida com soma ponderada dos scores normalizados (alternativa ao RRF).
    retrieval:
      top_k: 5
      hybrid:
        fusion: weighted
        weights:
          semantic: 0.7
          sparse: 0.3
        bm25_language: portuguese
  rerank:
    <<: *pipeline_defaults
    description: Baseline com reranking dos 20 primeiros excertos por um cross-encoder multilingue.
    retrieval:
      top_k: 5
      rerank:
        model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1   # local, CPU (~470 MB)
        candidates: 20
  filtro_data:
    <<: *pipeline_defaults
    description: Baseline que, quando a pergunta indica a data de uma reunião, pesquisa só nessa ata.
    retrieval:
      top_k: 5
      date_filter: true
  prompt_sem_fontes:
    <<: *pipeline_defaults
    description: Baseline sem obrigação de citar a ata no fim da resposta.
    prompt:
      strict_grounding: true
      abstention_text: A informação não consta das atas fornecidas.
      language: português europeu
      require_citations: false

# Seis modelos na gama mais compacta disponível: quatro de 8--9B e dois de 14B.
# O par AMALIA permite comparar SFT e DPO na mesma família e escala.
# Todos são chamados pelo cliente Ollama autenticado acima.
models:
  - name: qwen3-8b
    model: qwen3:8b
  - name: gervasio-8b-ptpt
    model: hf.co/mradermacher/gervasio-8b-portuguese-ptpt-decoder-GGUF:Q4_K_M
    # A conversão GGUF no servidor não declara o fim de resposta do modelo: sem isto,
    # o marcador "<|im_end|>" aparecia como texto no fim de 25 das 28 respostas.
    stop: ["<|im_end|>"]
  - name: amalia-0626-dpo-9b
    model: amalia-9b-0626-dpo:latest
  - name: amalia-0626-sft-9b
    model: amalia-9b-0626-sft:latest
  - name: phi4-14b
    model: phi4:14b
  - name: ministral-3-14b
    model: ministral-3:14b

# Orquestrador/juiz RAGAS: não gera as respostas experimentais; avalia-as.
# Tem 26B, acima dos geradores mas mais económico do que o anterior modelo de 119B.
judge:
  model: gemma4:26b
